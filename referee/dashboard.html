<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referee Dashboard | FFJS</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>FFJS</h2>
            </div>
            <ul class="menu">
                <li class="active"><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                <li><a href="assigned-matches.html"><i class="fa-solid fa-futbol"></i> Assigned Matches</a></li>
                <li><a href="submit-results.html"><i class="fa-solid fa-square-poll-horizontal"></i> Submit Results</a></li>
                <li><a href="player-statistics.html"><i class="fa-solid fa-chart-bar"></i> Player Statistics</a></li>
                <li><a href="match-history.html"><i class="fa-solid fa-clock-rotate-left"></i> Match History</a></li>
                <li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="topbar">
                <h1>Referee Dashboard</h1>
                <div class="admin-info"><i class="fa-solid fa-user"></i><span id="userName">Loading...</span></div>
            </div>
            <div class="cards">
                <div class="card"><i class="fa-solid fa-futbol"></i>
                    <div>
                        <h3 id="statAssigned">--</h3>
                        <p>Assigned Matches</p>
                    </div>
                </div>
                <div class="card"><i class="fa-solid fa-check"></i>
                    <div>
                        <h3 id="statVerified">--</h3>
                        <p>Verified Results</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/app.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        requireAuth(['referee']);

        async function loadRefereeDashboard() {
            const res = await apiGet('admin/stats.php');
            if (res.success) {
                renderStat('statAssigned', res.data.assigned_matches);
                renderStat('statVerified', res.data.verified_results);
            }
        }

        document.addEventListener('DOMContentLoaded', loadRefereeDashboard);
    </script>
</body>

</html>
