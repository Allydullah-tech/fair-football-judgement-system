<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Team | FFJS</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>FFJS</h2>
            </div>
            <ul class="menu">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                <li class="active"><a href="register-team.html"><i class="fa-solid fa-users"></i> Register Team</a></li>
                <li><a href="register-players.html"><i class="fa-solid fa-person-running"></i> Register Players</a></li>
                <li><a href="fixtures.html"><i class="fa-solid fa-futbol"></i> Fixtures</a></li>
                <li><a href="results.html"><i class="fa-solid fa-square-poll-horizontal"></i> Results</a></li>
                <li><a href="prizes.html"><i class="fa-solid fa-trophy"></i> Prizes</a></li>
                <li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="topbar">
                <h1>Register Team</h1>
            </div>
            <div class="form-container">
                <div id="formAlert" style="display:none;padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:14px;"></div>
                <form id="registerTeamForm">
                    <div class="form-group">
                        <label>Team Name</label>
                        <input type="text" id="teamName" placeholder="Enter team name">
                    </div>
                    <div class="form-group">
                        <label>Total Players</label>
                        <input type="number" id="totalPlayers" placeholder="Enter number of players" min="1">
                    </div>
                    <button type="submit" class="submit-btn">Register Team</button>
                </form>
            </div>
        </main>
    </div>
    <script src="../js/app.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        requireAuth(['manager']);

        document.getElementById('registerTeamForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const alertEl = document.getElementById('formAlert');
            const teamName = document.getElementById('teamName').value.trim();
            const totalPlayers = document.getElementById('totalPlayers').value;

            if (!teamName || !totalPlayers) {
                alertEl.style.display = 'block';
                alertEl.style.background = '#fee2e2';
                alertEl.style.color = '#991b1b';
                alertEl.textContent = 'Please fill all fields.';
                return;
            }

            const res = await apiPost('manager/register_team.php', {
                name: teamName,
                players: totalPlayers
            });
            alertEl.style.display = 'block';
            if (res.success) {
                alertEl.style.background = '#d1fae5';
                alertEl.style.color = '#065f46';
                alertEl.textContent = 'Team registered successfully!';
                document.getElementById('registerTeamForm').reset();
            } else {
                alertEl.style.background = '#fee2e2';
                alertEl.style.color = '#991b1b';
                alertEl.textContent = res.message || 'Registration failed.';
            }
        });
    </script>
</body>

</html>
