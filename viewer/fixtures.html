<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixtures | FFJS</title>

    <!-- KEEPING ORIGINAL PATHS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tables.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <nav class="navbar">
        <h2 class="logo">FFJS</h2>

        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="results.html">Results</a></li>
            <li><a href="standings.html">Standings</a></li>
            <li><a href="prize-distribution.html">Prizes</a></li>
            <li><a href="../about.html">About</a></li>
            <li><a href="../login.html" class="login-btn">Login</a></li>
        </ul>
    </nav>

    <section class="page-header">
        <h1>Upcoming Fixtures</h1>
        <p>Scheduled football matches</p>
    </section>

    <section class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Match</th>
                    <th>Date</th>
                    <th>Venue</th>
                </tr>
            </thead>

            <tbody id="fixturesTbody">
                <tr>
                    <td colspan="3" style="text-align:center;padding:20px;color:#888;">
                        Loading...
                    </td>
                </tr>
            </tbody>
        </table>
    </section>

    <footer>
        <p>© 2026 Fair Football Judgement System | Final Year Project</p>
    </footer>

    <script>
        async function loadFixtures() {

            try {

                // FIXED API PATH FOR VIEWER SECTION
                var res = await fetch('../backend/api/viewer/fixtures.php');

                var data = await res.json();

                var tbody = document.getElementById('fixturesTbody');

                if (data.success && data.data && data.data.length > 0) {

                    tbody.innerHTML = data.data.map(function(f) {

                        return '<tr>' +
                            '<td>' + f.team_a + ' vs ' + f.team_b + '</td>' +
                            '<td>' + f.match_date + '</td>' +
                            '<td>' + f.venue + '</td>' +
                            '</tr>';

                    }).join('');

                } else {

                    tbody.innerHTML =
                        '<tr>' +
                        '<td colspan="3" style="text-align:center;padding:20px;color:#888;">' +
                        'No upcoming fixtures.' +
                        '</td>' +
                        '</tr>';
                }

            } catch (e) {

                document.getElementById('fixturesTbody').innerHTML =
                    '<tr>' +
                    '<td colspan="3" style="text-align:center;padding:20px;color:#888;">' +
                    'Could not load fixtures.' +
                    '</td>' +
                    '</tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadFixtures);
    </script>

</body>

</html>
