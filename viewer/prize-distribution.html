<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prize Distribution | FFJS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <nav class="navbar">
        <h2 class="logo">FFJS</h2>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="fixtures.html">Fixtures</a></li>
            <li><a href="standings.html">Standings</a></li>
            <li><a href="results.html">Results</a></li>
            <li><a href="prize-distribution.html">Prizes</a></li>
            <li><a href="../login.html">Login</a></li>
        </ul>
    </nav>

    <section class="page-header">
        <h1>Prize Distribution</h1>
        <p>Transparent football prize allocation records</p>
    </section>

    <section class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Winner</th>
                    <th>Prize</th>
                    <th>Criteria</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="prizesTbody">
                <tr>
                    <td colspan="4" style="text-align:center;padding:20px;color:#888;">Loading...</td>
                </tr>
            </tbody>
        </table>
    </section>

    <footer>
        <p>© 2026 Fair Football Judgement System | Final Year Project</p>
    </footer>

    <script>
        async function loadPrizes() {

            try {

                var res = await fetch('../backend/api/viewer/prize-distribution.php');

                var data = await res.json();

                var tbody = document.getElementById('prizesTbody');

                if (data.success && data.data && data.data.length > 0) {

                    tbody.innerHTML = data.data.map(function(p) {

                        return '<tr>' +
                            '<td>' + p.winner + '</td>' +
                            '<td>' + p.prize + '</td>' +
                            '<td>' + p.criteria + '</td>' +
                            '<td><span class="completed">Approved</span></td>' +
                            '</tr>';

                    }).join('');

                } else {

                    tbody.innerHTML =
                        '<tr>' +
                        '<td colspan="4" style="text-align:center;padding:20px;color:#888;">' +
                        'No prizes distributed yet.' +
                        '</td>' +
                        '</tr>';
                }

            } catch (e) {

                document.getElementById('prizesTbody').innerHTML =
                    '<tr>' +
                    '<td colspan="4" style="text-align:center;padding:20px;color:#888;">' +
                    'Could not load data.' +
                    '</td>' +
                    '</tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadPrizes);
    </script>

</body>

</html>
