<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Results | FFJS</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>FFJS</h2>
            </div>
            <ul class="menu">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                <li><a href="teams.html"><i class="fa-solid fa-users"></i> Teams</a></li>
                <li><a href="matches.html"><i class="fa-solid fa-futbol"></i> Matches</a></li>
                <li><a href="referees.html"><i class="fa-solid fa-user-tie"></i> Referees</a></li>
                <li class="active"><a href="results.html"><i class="fa-solid fa-square-poll-horizontal"></i> Results</a></li>
                <li><a href="prizes.html"><i class="fa-solid fa-trophy"></i> Prizes</a></li>
                <li><a href="reports.html"><i class="fa-solid fa-file"></i> Reports</a></li>
                <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
                <li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="topbar">
                <h1>Match Results</h1>
            </div>
            <div class="table-section">
                <table>
                    <thead>
                        <tr>
                            <th>Match</th>
                            <th>Date</th>
                            <th>Score</th>
                            <th>Referee</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTbody">
                        <tr>
                            <td colspan="6" style="text-align:center;padding:20px;color:#888;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="../js/app.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        requireAuth(['administrator']);

        async function loadResults() {
            const res = await apiGet('admin/results.php', {
                action: 'all'
            });
            if (res.success) {
                if (res.data.length === 0) {
                    renderTable('resultsTbody', [], 'No results submitted yet.');
                    return;
                }
                const rows = res.data.map(r => `
                    <tr>
                        <td>${r.team_a} vs ${r.team_b}</td>
                        <td>${r.match_date}</td>
                        <td><strong>${r.score}</strong></td>
                        <td>${r.referee}</td>
                        <td>${statusBadge(r.status)}</td>
                        <td>${r.status === 'pending'
                            ? `<button onclick="verifyResult(${r.id})" style="background:#0b5d1e;color:white;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;">Verify</button>`
                            : '<span style="color:#888;">Verified</span>'}</td>
                    </tr>`);
                renderTable('resultsTbody', rows, 'No results submitted yet.');
            } else {
                renderTable('resultsTbody', [], 'Could not load results.');
            }
        }

        async function verifyResult(id) {
            if (!confirm('Verify this result?')) return;
            const res = await apiPost('admin/results.php', { action: 'verify', id });
            if (res.success) { showToast('Result verified successfully.'); loadResults(); }
            else showToast(res.message || 'Failed to verify.', 'error');
        }

        document.addEventListener('DOMContentLoaded', loadResults);
    </script>
</body>

</html>
