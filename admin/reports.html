<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | FFJS</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>FFJS</h2>
            </div>
            <ul class="menu">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                <li><a href="teams.html"><i class="fa-solid fa-users"></i> Teams</a></li>
                <li><a href="matches.html"><i class="fa-solid fa-futbol"></i> Matches</a></li>
                <li><a href="referees.html"><i class="fa-solid fa-user-tie"></i> Referees</a></li>
                <li><a href="results.html"><i class="fa-solid fa-square-poll-horizontal"></i> Results</a></li>
                <li><a href="prizes.html"><i class="fa-solid fa-trophy"></i> Prizes</a></li>
                <li class="active"><a href="reports.html"><i class="fa-solid fa-file"></i> Reports</a></li>
                <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
                <li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="topbar">
                <h1>System Reports</h1>
            </div>
            <div class="cards">
                <div class="card"><i class="fa-solid fa-users"></i>
                    <div>
                        <h3 id="statTeams">--</h3>
                        <p>Total Teams</p>
                    </div>
                </div>
                <div class="card"><i class="fa-solid fa-futbol"></i>
                    <div>
                        <h3 id="statMatches">--</h3>
                        <p>Total Matches</p>
                    </div>
                </div>
                <div class="card"><i class="fa-solid fa-trophy"></i>
                    <div>
                        <h3 id="statPrizes">--</h3>
                        <p>Distributed Awards</p>
                    </div>
                </div>
            </div>
            <div class="table-section">
                <div class="section-header">
                    <h2>Recent Activities</h2>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Activity</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="activitiesTbody">
                        <tr>
                            <td colspan="3" style="text-align:center;padding:20px;color:#888;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="../js/app.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        requireAuth(['administrator']);

        async function loadReports() {
            const stats = await apiGet('admin/stats.php');
            if (stats.success) {
                renderStat('statTeams', stats.data.teams);
                renderStat('statMatches', stats.data.matches);
                renderStat('statPrizes', stats.data.prizes);
            }
            const activities = await apiGet('admin/reports.php', {
                action: 'activities'
            });
            if (activities.success) {
                const rows = activities.data.map(a => `
                    <tr>
                        <td>${a.activity}</td>
                        <td>${a.date}</td>
                        <td>${statusBadge(a.status)}</td>
                    </tr>`);
                renderTable('activitiesTbody', rows, 'No recent activities.');
            }
        }

        document.addEventListener('DOMContentLoaded', loadReports);
    </script>
</body>

</html>
