<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referees Management | FFJS</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>FFJS</h2>
            </div>
            <ul class="menu">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                <li><a href="teams.html"><i class="fa-solid fa-users"></i> Teams</a></li>
                <li><a href="matches.html"><i class="fa-solid fa-futbol"></i> Matches</a></li>
                <li class="active"><a href="referees.html"><i class="fa-solid fa-user-tie"></i> Referees</a></li>
                <li><a href="results.html"><i class="fa-solid fa-square-poll-horizontal"></i> Results</a></li>
                <li><a href="prizes.html"><i class="fa-solid fa-trophy"></i> Prizes</a></li>
                <li><a href="reports.html"><i class="fa-solid fa-file"></i> Reports</a></li>
                <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
                <li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="topbar">
                <h1>Referees Management</h1>
            </div>
            <div class="table-section">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Assigned Matches</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="refereesTbody">
                        <tr>
                            <td colspan="5" style="text-align:center;padding:20px;color:#888;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="../js/app.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        requireAuth(['administrator']);

        async function loadReferees() {
            var res = await apiGet('admin/referees.php');
            if (res.success) {
                var rows = res.data.map(function(r) {
                    return '<tr><td>' + r.name + '</td><td>' + r.email + '</td><td>' + r.assigned_matches + '</td><td>' + statusBadge(r.status) + '</td><td><button onclick="removeReferee(' + r.id + ')">Remove</button></td></tr>';
                });
                renderTable('refereesTbody', rows, 'No referees registered yet.');
            }
        }

        async function removeReferee(id) {
            if (!confirm('Remove this referee?')) return;
            var res = await apiPost('admin/referees.php', {
                action: 'remove',
                id: id
            });
            if (res.success) loadReferees();
            else alert(res.message || 'Failed.');
        }

        document.addEventListener('DOMContentLoaded', loadReferees);
    </script>
</body>

</html>
