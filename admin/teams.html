<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams Management | FFJS</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .players-row {
            display: none;
            background: #f9fafb;
        }
        
        .players-row.show {
            display: table-row;
        }
        
        .players-inner {
            padding: 16px 20px;
        }
        
        .players-inner table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }
        
        .players-inner table th {
            background: #15803d;
            color: white;
            padding: 8px 12px;
            font-size: 13px;
        }
        
        .players-inner table td {
            padding: 8px 12px;
            font-size: 13px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #0b5d1e;
            font-size: 16px;
            padding: 4px;
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 460px;
        }
        
        .modal-box h3 {
            margin-bottom: 20px;
            color: #0b5d1e;
        }
        
        .modal-box .form-group {
            margin-bottom: 16px;
        }
        
        .modal-box .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        
        .modal-box .form-group input,
        .modal-box .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn-save {
            background: #0b5d1e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
        }
        
        .btn-save:hover {
            background: #15803d;
        }
        
        .btn-cancel {
            background: #e5e7eb;
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
        }
        
        .modal-alert {
            display: none;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .modal-alert.show {
            display: block;
        }
        
        .modal-alert.error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .modal-alert.success {
            background: #d1fae5;
            color: #065f46;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>FFJS</h2>
            </div>
            <ul class="menu">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                <li class="active"><a href="teams.html"><i class="fa-solid fa-users"></i> Teams</a></li>
                <li><a href="matches.html"><i class="fa-solid fa-futbol"></i> Matches</a></li>
                <li><a href="referees.html"><i class="fa-solid fa-user-tie"></i> Referees</a></li>
                <li><a href="results.html"><i class="fa-solid fa-square-poll-horizontal"></i> Results</a></li>
                <li><a href="prizes.html"><i class="fa-solid fa-trophy"></i> Prizes</a></li>
                <li><a href="reports.html"><i class="fa-solid fa-file"></i> Reports</a></li>
                <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
                <li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="topbar">
                <h1>Teams Management</h1>
            </div>
            <div class="table-section">
                <table id="teamsTable">
                    <thead>
                        <tr>
                            <th></th>
                            <th>Team Name</th>
                            <th>Manager</th>
                            <th>Max Players</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="teamsTbody">
                        <tr>
                            <td colspan="6" style="text-align:center;padding:20px;color:#888;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Edit Team Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <h3>Edit Team</h3>
            <div class="modal-alert" id="editAlert"></div>
            <form id="editTeamForm">
                <input type="hidden" id="editTeamId">
                <div class="form-group">
                    <label>Team Name</label>
                    <input type="text" id="editTeamName">
                </div>
                <div class="form-group">
                    <label>Max Players</label>
                    <input type="number" id="editTeamPlayers" min="1">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="editTeamStatus">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn-save">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        requireAuth(['administrator']);

        async function loadTeams() {
            const res = await apiGet('admin/teams.php', {
                action: 'all'
            });
            const tbody = document.getElementById('teamsTbody');
            if (!res.success || res.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;color:#888;">No teams registered yet.</td></tr>';
                return;
            }
            let html = '';
            res.data.forEach(function(t) {
                var badge = t.status === 'active' ?
                    '<span class="completed">Active</span>' :
                    '<span class="pending">Inactive</span>';
                html += '<tr>';
                html += '<td><button class="toggle-btn" onclick="togglePlayers(' + t.id + ')" title="View Players"><i class="fa-solid fa-chevron-down" id="chevron-' + t.id + '"></i></button></td>';
                html += '<td><strong>' + t.name + '</strong></td>';
                html += '<td>' + t.manager + '</td>';
                html += '<td>' + t.players + '</td>';
                html += '<td>' + badge + '</td>';
                html += '<td><button onclick="openEditModal(' + t.id + ', \'' + t.name + '\', ' + t.players + ', \'' + t.status + '\')">Edit</button> <button onclick="deleteTeam(' + t.id + ')">Delete</button></td>';
                html += '</tr>';
                html += '<tr class="players-row" id="players-row-' + t.id + '">';
                html += '<td colspan="6"><div class="players-inner" id="players-inner-' + t.id + '"><em style="color:#888;">Click arrow to load players...</em></div></td>';
                html += '</tr>';
            });
            tbody.innerHTML = html;
        }

        async function togglePlayers(teamId) {
            var row = document.getElementById('players-row-' + teamId);
            var inner = document.getElementById('players-inner-' + teamId);
            var chevron = document.getElementById('chevron-' + teamId);

            if (row.classList.contains('show')) {
                row.classList.remove('show');
                chevron.className = 'fa-solid fa-chevron-down';
                return;
            }

            row.classList.add('show');
            chevron.className = 'fa-solid fa-chevron-up';
            inner.innerHTML = '<em style="color:#888;">Loading players...</em>';

            var res = await apiGet('admin/teams.php', {
                action: 'players',
                team_id: teamId
            });

            if (!res.success || res.data.length === 0) {
                inner.innerHTML = '<em style="color:#888;">No players registered for this team yet.</em>';
                return;
            }

            var html = '<table><thead><tr><th>#</th><th>Name</th><th>Position</th><th>Status</th></tr></thead><tbody>';
            res.data.forEach(function(p) {
                var badge = p.status === 'active' ?
                    '<span class="completed">Active</span>' :
                    '<span class="pending">Inactive</span>';
                html += '<tr><td>' + p.jersey_number + '</td><td>' + p.name + '</td><td>' + p.position + '</td><td>' + badge + '</td></tr>';
            });
            html += '</tbody></table>';
            inner.innerHTML = html;
        }

        function openEditModal(id, name, players, status) {
            document.getElementById('editTeamId').value = id;
            document.getElementById('editTeamName').value = name;
            document.getElementById('editTeamPlayers').value = players;
            document.getElementById('editTeamStatus').value = status;
            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            document.getElementById('editAlert').className = 'modal-alert';
        }

        document.getElementById('editTeamForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var alertEl = document.getElementById('editAlert');
            var res = await apiPost('admin/teams.php', {
                action: 'edit',
                id: document.getElementById('editTeamId').value,
                name: document.getElementById('editTeamName').value.trim(),
                players: document.getElementById('editTeamPlayers').value,
                status: document.getElementById('editTeamStatus').value
            });
            if (res.success) {
                alertEl.className = 'modal-alert show success';
                alertEl.textContent = 'Team updated successfully!';
                loadTeams();
                setTimeout(closeEditModal, 1500);
            } else {
                alertEl.className = 'modal-alert show error';
                alertEl.textContent = res.message || 'Failed.';
            }
        });

        async function deleteTeam(id) {
            if (!confirm('Are you sure you want to delete this team?')) return;
            var res = await apiPost('admin/teams.php', {
                action: 'delete',
                id: id
            });
            if (res.success) {
                showToast('Team deleted.');
                loadTeams();
            } else showToast(res.message || 'Delete failed.', 'error');
        }

        document.addEventListener('DOMContentLoaded', loadTeams);
    </script>
</body>

</html>
